<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Egypt | Land of the Pharaohs</title>
  <meta name="description" content="Stand before the pyramids of Giza, sail the Nile at sunrise and discover Egypt - Land of the Pharaohs.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #E9B556;
      --cream: #FBF1DC;
      --bronze-dark: #140E08;
      --bronze-mid: #2A1807;
      --text-muted: #F0E3C6;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html {
      scroll-padding-top: env(safe-area-inset-top, 0px)
    }

    *,
    *::before,
    *::after {
      box-sizing: inherit;
      margin: 0;
      padding: 0
    }

    body {
      margin: 0;
      background: var(--bronze-dark);
      color: var(--cream);
      font-family: Montserrat, system-ui, -apple-system, sans-serif;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased
    }

    /* Hero Section */
    .hero {
      position: relative;
      min-height: 540px;
      display: flex;
      align-items: center;
      overflow: hidden;
      background: var(--bronze-dark)
    }

    #art {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
      pointer-events: none
    }

    .hero::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: linear-gradient(90deg, rgba(18, 10, 5, .92) 0%, rgba(18, 10, 5, .74) 34%, rgba(18, 10, 5, .22) 60%, transparent 80%)
    }

    #particles-js {
      position: absolute;
      inset: 0;
      z-index: 2;
      pointer-events: auto
    }

    #particles-js canvas {
      pointer-events: auto
    }

    .inner {
      position: relative;
      z-index: 3;
      width: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 4.5rem clamp(1.25rem, 5vw, 4rem) 4rem;
      display: flex;
      align-items: center;
      pointer-events: none
    }

    .copy {
      max-width: 520px
    }

    .copy>* {
      pointer-events: auto
    }

    h1 {
      margin: 0 0 1.1rem;
      font-weight: 800;
      font-size: clamp(3.8rem, 8vw, 7.2rem);
      line-height: .94;
      letter-spacing: .04em;
      color: #fff;
      text-shadow: 0 4px 35px rgba(0, 0, 0, .65), 0 2px 8px rgba(18, 10, 5, .8)
    }

    h2 {
      margin: 0 0 1.2rem;
      font-weight: 800;
      font-size: clamp(1.25rem, 2.2vw, 1.95rem);
      line-height: 1.25;
      letter-spacing: .03em;
      text-transform: uppercase;
      color: #FFF2D6;
      text-shadow: 0 2px 18px rgba(0, 0, 0, .65)
    }

    .lead {
      margin: 0;
      max-width: 32rem;
      font-weight: 500;
      font-size: clamp(1rem, 1.35vw, 1.15rem);
      line-height: 1.65;
      color: var(--text-muted);
      text-shadow: 0 2px 12px rgba(0, 0, 0, .7)
    }

    /* Palm Fronds */
    .frond-1 {
      transform-origin: 0% 0%;
      animation: palmSway1 10s ease-in-out infinite alternate;
      will-change: transform
    }

    .frond-2 {
      transform-origin: 0% 6%;
      animation: palmSway2 12s ease-in-out 1s infinite alternate;
      will-change: transform
    }

    .frond-3 {
      transform-origin: 0% 16%;
      animation: palmSway3 8.5s ease-in-out 2s infinite alternate;
      will-change: transform
    }

    .hero.is-paused .frond-1,
    .hero.is-paused .frond-2,
    .hero.is-paused .frond-3,
    body.is-hidden .ticker-track {
      animation-play-state: paused !important
    }

    @keyframes palmSway1 {
      0% {
        transform: rotate(0deg)
      }

      100% {
        transform: rotate(1.8deg) translateY(2px)
      }
    }

    @keyframes palmSway2 {
      0% {
        transform: rotate(0deg)
      }

      100% {
        transform: rotate(-1.5deg) translateY(1.5px)
      }
    }

    @keyframes palmSway3 {
      0% {
        transform: rotate(0deg)
      }

      100% {
        transform: rotate(2deg) translateY(1px)
      }
    }

    /* Marquee */
    .ticker-track-container {
      position: relative;
      z-index: 4;
      width: 100%;
      height: 68px;
      overflow: hidden;
      display: flex;
      align-items: center;
      background: var(--cream);
      color: var(--bronze-mid);
      font-family: Montserrat, system-ui, sans-serif;
      font-weight: 700;
      font-size: clamp(.85rem, 1.2vw, 1.05rem);
      letter-spacing: .12em;
      border-top: 1px solid rgba(233, 181, 86, .35);
      box-shadow: 0 4px 20px rgba(0, 0, 0, .22);
      user-select: none
    }

    .ticker-track-container:hover .ticker-track,
    .ticker-track-container:focus-within .ticker-track {
      animation-play-state: paused
    }

    .ticker-track {
      display: flex;
      width: max-content;
      align-items: center;
      white-space: nowrap;
      animation: slide var(--dur, 60s) linear infinite;
      will-change: transform
    }

    @keyframes slide {
      to {
        transform: translate3d(calc(-1 * var(--dist, 1000px)), 0, 0)
      }
    }

    .ticker-group {
      display: flex;
      align-items: center;
      flex-shrink: 0;
      gap: 1.6rem;
      padding-right: 1.6rem
    }

    .ticker-group a {
      color: inherit;
      text-decoration: none;
      text-transform: uppercase;
      border-bottom: 2px solid transparent;
      padding: 0.2rem 0;
      transition: color .2s, border-color .2s
    }

    .ticker-group a:hover {
      color: #8C5929;
      border-color: #8C5929
    }

    .ticker-group a:focus-visible {
      outline: 2px solid var(--gold);
      outline-offset: 3px
    }

    .ticker-separator {
      width: 18px;
      height: 24px;
      flex: 0 0 auto;
      color: var(--gold);
      display: inline-flex;
      align-items: center;
      justify-content: center
    }

    @media(max-width:860px) {
      .hero {
        min-height: 520px;
        align-items: flex-start
      }

      .inner {
        padding: 3.5rem clamp(1.25rem, 4vw, 2.5rem) 2.5rem
      }

      .hero::before {
        background: linear-gradient(180deg, rgba(18, 10, 5, .94) 0%, rgba(18, 10, 5, .75) 45%, rgba(18, 10, 5, .28) 75%, rgba(18, 10, 5, .68) 100%)
      }

      .copy {
        max-width: 100%
      }

      h1 {
        font-size: clamp(3.2rem, 13vw, 5.5rem);
        margin-bottom: .9rem
      }

      h2 {
        font-size: clamp(1.15rem, 4vw, 1.55rem);
        margin-bottom: .9rem
      }

      .lead {
        font-size: .95rem;
        max-width: 95%
      }
    }

    @media(prefers-reduced-motion:reduce) {

      .frond-1,
      .frond-2,
      .frond-3,
      .ticker-track {
        animation: none !important
      }

      .ticker-track-container {
        overflow-x: auto
      }
    }
  </style>
</head>

<body>
  <header class="hero" id="hero">
    <svg id="art" viewBox="0 0 1200 700" preserveAspectRatio="xMidYMid slice" role="img"
      aria-label="Egypt map filled with hieroglyphic inscriptions over a cinematic Giza pyramid landscape">
      <defs>
        <!-- Atmospheric gradients -->
        <linearGradient id="skyg" x1="0" y1="0" x2="0" y2="1">

          <stop offset=".91" stop-color="#F5CB84" />
          <stop offset="1" stop-color="#FDF1D8" />

        <radialGradient id="sun" cx="875" cy="275" r="420" gradientUnits="userSpaceOnUse">

    <div id="particles-js" aria-hidden="true"></div>

    <div class="inner">
      <div class="copy">
        <h1>EGYPT</h1>
        <h2>Land of the pharaohs,<br>gift of the Nile</h2>
        <p class="lead">Stand before the pyramids of Giza, sail the Nile at sunrise and discover the gateway between
          Africa and the world.</p>

  <div class="ticker-track-container" id="identity" aria-label="Egypt Heritage and Landmarks">
    <div class="ticker-track" id="ticker-track"></div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/particles.js/2.0.0/particles.min.js"></script>
  <script>
    const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

    /* ==========================================================================
       Constellation / Network Particle System
       Sparse nodes + thin connecting proximity lines + warm Egypt colors
       ========================================================================== */
    const Particles = {
      tier: null,
      init() {
        const w = innerWidth, t = w < 768 ? 'm' : w <= 1200 ? 't' : 'd';
        if (t === this.tier) return;
        this.tier = t;

        try {
          this.pause();
          if (window.pJSDom && window.pJSDom.length) {
            window.pJSDom.forEach(d => {
              try {
                if (d && d.pJS && d.pJS.fn && d.pJS.fn.vendors && d.pJS.fn.vendors.destroypJS) {
                  d.pJS.fn.vendors.destroypJS();
                }
              } catch (e) { }
            });
            window.pJSDom = [];
          }
          const el = document.getElementById('particles-js');
          if (el) el.innerHTML = '';

          if (typeof particlesJS === 'function') {
            particlesJS('particles-js', {
              particles: {
                number: {
                  value: t === 'm' ? 14 : t === 't' ? 24 : 34,
                  density: { enable: true, value_area: 900 }
                },
                color: {
                  value: ['#FFF4D6', '#E9B556', '#F7E4B8']
                },
                shape: { type: 'circle' },
                opacity: {
                  value: 0.48,
                  random: true,
                  anim: { enable: !reduced, speed: 0.6, opacity_min: 0.18, sync: false }
                },
                size: {
                  value: 2.4,
                  random: true,
                  anim: { enable: !reduced, speed: 1.1, size_min: 0.8, sync: false }
                },
                line_linked: {
                  enable: true,
                  distance: t === 'm' ? 80 : t === 't' ? 105 : 125,
                  color: '#F7E4B8',
                  opacity: 0.22,
                  width: 1
                },
                move: {
                  enable: !reduced,
                  speed: reduced ? 0 : 1.15,
                  direction: 'none',
                  random: false,
                  straight: false,
                  out_mode: 'out',
                  bounce: false
                }
              },
              interactivity: {
                detect_on: 'canvas',
                events: {
                  onhover: { enable: !reduced, mode: 'repulse' },
                  onclick: { enable: !reduced, mode: 'push' },
                  resize: false
                },
                modes: {
                  repulse: { distance: 90, duration: 0.4 },
                  push: { particles_nb: 2 }
                }
              },
              retina_detect: false
            });
          }
        } catch (e) { }
      },
      pause() {
        (window.pJSDom || []).forEach(d => {
          const f = d?.pJS?.fn;
          if (f?.drawAnimFrame) {
            (window.cancelRequestAnimFrame || cancelAnimationFrame)(f.drawAnimFrame);
            f.drawAnimFrame = null;
          }
        });
      },
      resume() {
        if (reduced) return;
        (window.pJSDom || []).forEach(d => {
          const p = d?.pJS;
          if (p && !p.fn.drawAnimFrame && p.particles?.move?.enable) {
            p.fn.drawAnimFrame = (window.requestAnimFrame || requestAnimationFrame)(p.fn.vendors.draw);
          }
        });
      }
    };

    /* ==========================================================================
       Marquee & Responsive Setup
       ========================================================================== */
    (function () {
      const hero = document.getElementById('hero');
      const svg = document.getElementById('art');
      const box = document.getElementById('identity');
      const track = document.getElementById('ticker-track');

      const ITEMS = [
        { label: 'EGYPT', href: '/egypt' },
        { label: 'CAIRO', href: '/egypt/cairo' },
        { label: 'GIZA', href: '/egypt/giza' },
        { label: 'THE NILE', href: '/egypt/nile' },
        { label: 'ALEXANDRIA', href: '/egypt/alexandria' },
        { label: 'LUXOR', href: '/egypt/luxor' },
        { label: 'ASWAN', href: '/egypt/aswan' },
        { label: 'SINAI', href: '/egypt/sinai' },
        { label: 'RED SEA', href: '/egypt/red-sea' },
        { label: 'ANCIENT HERITAGE', href: '/egypt/ancient-heritage' },
        { label: 'MODERN OPPORTUNITY', href: '/egypt/modern-opportunity' },
        { label: 'AFRICA', href: '/africa' },
        { label: 'MIDDLE EAST', href: '/middle-east' }
      ];

      const ANKH_SEPARATOR = '<span class="ticker-separator" aria-hidden="true">' +
        '<svg viewBox="0 0 18 24" width="18" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
        '<path d="M9,11.5 C6.5,11.5 5,9.2 5,6.5 C5,3.8 6.8,2 9,2 C11.2,2 13,3.8 13,6.5 C13,9.2 11.5,11.5 9,11.5 Z"/>' +
        '<line x1="3" y1="13.5" x2="15" y2="13.5"/>' +
        '<line x1="9" y1="11.5" x2="9" y2="22"/>' +
        '</svg>' +
        '</span>';

      const seq = ITEMS.map(it => '<a href="' + it.href + '">' + it.label + '</a>' + ANKH_SEPARATOR).join('');
      let lastW = 0;

      function buildMarquee(force) {
        if (!box || !track) return;
        const w = box.clientWidth || innerWidth;
        if (!force && Math.abs(w - lastW) < 2) return;
        lastW = w;
        track.innerHTML = '';

        const g1 = document.createElement('div');
        g1.className = 'ticker-group';
        g1.innerHTML = seq;
        track.appendChild(g1);

        let gw = g1.getBoundingClientRect().width || 1;
        const reps = Math.max(1, Math.ceil((w * 1.15) / gw));
        if (reps > 1) {
          g1.innerHTML = seq.repeat(reps);
          gw = g1.getBoundingClientRect().width || 1;
        }

        const g2 = g1.cloneNode(true);
        g2.setAttribute('aria-hidden', 'true');
        g2.querySelectorAll('a').forEach(a => a.tabIndex = -1);
        track.appendChild(g2);

        track.style.setProperty('--dist', gw.toFixed(2) + 'px');
        track.style.setProperty('--dur', (gw / 35).toFixed(2) + 's');
      }

      function fit() {
        if (!svg) return;
        const w = innerWidth;
        if (w < 768) {
          svg.setAttribute('viewBox', '450 0 750 700');
        } else if (w < 1024) {
          svg.setAttribute('viewBox', '200 0 1000 700');
        } else {
          svg.setAttribute('viewBox', '0 0 1200 700');
        }
      }

      fit();
      buildMarquee(true);
      Particles.init();
      if (document.fonts && document.fonts.ready) {
        document.fonts.ready.then(() => { buildMarquee(true); });
      }

      let rz = null;
      const onResize = () => {
        cancelAnimationFrame(rz);
        rz = requestAnimationFrame(() => {
          fit();
          Particles.init();
          buildMarquee(false);
        });
      };

      if (window.ResizeObserver && hero) {
        const ro = new ResizeObserver(onResize);
        ro.observe(hero);
      } else {
        addEventListener('resize', onResize, { passive: true });
      }

      function updateVisibility(visible) {
        if (hero) hero.classList.toggle('is-paused', !visible);
        if (visible) {
          Particles.resume();
        } else {
          Particles.pause();
        }
      }

      let lastV = null;
      if ('IntersectionObserver' in window && hero) {
        new IntersectionObserver(es => {
          const en = es[es.length - 1], v = en.isIntersecting && en.intersectionRatio > 0.05;
          if (v === lastV) return;
          lastV = v;
          updateVisibility(v && !document.hidden);
        }, { threshold: [0, 0.05, 0.1], rootMargin: '100px' }).observe(hero);
      }

      document.addEventListener('visibilitychange', () => {
        const isHidden = document.hidden;
        document.body.classList.toggle('is-hidden', isHidden);
        if (isHidden) {
          updateVisibility(false);
        } else if (lastV !== false) {
          updateVisibility(true);
        }
      });
    })();
  </script>
